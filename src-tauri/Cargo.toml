[package]
name = "kwek"
edition.workspace = true
version.workspace = true
license-file.workspace = true

[lib]
name = "kwek_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kwek-core = { path = "../crates/kwek-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
url.workspace = true
uuid.workspace = true

# Desktop only. On Android there are no prebuilt ONNX Runtime binaries for search by
# meaning, and these plugins don't apply to a phone.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
kwek-core = { path = "../crates/kwek-core", features = ["semantic"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
