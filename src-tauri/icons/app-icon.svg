  <!-- Speech bubble. -->
  <path d="M300 330 h424 a70 70 0 0 1 70 70 v220 a70 70 0 0 1 -70 70 h-250 l-120 96 v-96 h-54 a70 70 0 0 1 -70 -70 v-220 a70 70 0 0 1 70 -70 z" fill="#ffffff"/>
  <!-- Three short lines: chatter. -->
  <rect x="330" y="420" width="300" height="34" rx="17" fill="#1b2320"/>
  <rect x="330" y="490" width="364" height="34" rx="17" fill="#1b2320"/>
  <rect x="330" y="560" width="210" height="34" rx="17" fill="#1b2320"/>
  <!-- Unread dot in highlighter yellow. -->
  <circle cx="748" cy="318" r="74" fill="#f5d659" stroke="#1b2320" stroke-width="22"/>
</svg>
