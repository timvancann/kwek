<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824px rounded square centred in 1024. Same tile and cyan as riff and rsdisk. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#05090b"/>
  <!-- Round speech bubble, tail at the bottom left. -->
  <circle cx="530" cy="490" r="265" fill="#35cdd6"/>
  <path d="M340 650 L262 800 L440 715 Z" fill="#35cdd6" stroke="#35cdd6" stroke-width="36" stroke-linejoin="round"/>
  <!-- Smile cut out in the tile colour. -->
  <path d="M394 493 A150 150 0 0 0 666 493" fill="none" stroke="#05090b" stroke-width="58" stroke-linecap="round"/>
</svg>
