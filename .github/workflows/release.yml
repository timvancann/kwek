name: Release

# Push a tag like v0.2.0 (the version in Cargo.toml, package.json and tauri.conf.json) and
# this builds kwek.app for Apple silicon, plus a Windows installer and an Android APK, and
# publishes them as a GitHub release. (Not Intel:
# ONNX Runtime, behind related search, has no prebuilt library for Intel Macs.) The build carries no Google client: each user gives kwek their own on first
# launch (docs/setup.md). With the signing secrets set (docs/releasing.md) the app is
# signed: with a Developer ID it is also notarized and opens like any other; with the
# self-signed "kwek release" certificate, or none, macOS asks once before opening it.
# With the updater key set, installed copies update to it (src-tauri/src/update.rs).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The Windows installer, signed with the updater key; the release job below publishes it
  # and lists it in latest.json. Not code-signed, so SmartScreen warns on the first install.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    # Pinned and uncached for the same reason as the release job: it holds the updater key.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: tools/fetch-model.sh
      - run: pnpm install --frozen-lockfile

      - name: Build the installer
        env:
          KWEK_UPDATES: "1"
        run: pnpm tauri build

      - name: Sign it for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No updater key (TAURI_SIGNING_PRIVATE_KEY). See docs/releasing.md."
            exit 1
          fi
          # The same name every release, like kwek-macOS.zip.
          cp target/release/bundle/nsis/*-setup.exe kwek-windows-setup.exe
          # A Windows path: the tauri CLI doesn't read Git Bash's /d/... ones.
          pnpm tauri signer sign "$(cygpath -w "$PWD/kwek-windows-setup.exe")"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            kwek-windows-setup.exe
            kwek-windows-setup.exe.sig
          if-no-files-found: error

  # The Android APK (arm64), signed with the release key (docs/releasing.md) so each one
  # installs over the last, and with the updater key for latest.json. Android can't update an
  # app in place: kwek offers the APK to download instead (src-tauri/src/update_android.rs).
  android:
    runs-on: ubuntu-latest
    # Pinned and uncached for the same reason as the release job: it holds the signing keys.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: pnpm install --frozen-lockfile

      # The runner image has the Android SDK, an NDK and JDK 17. The Android project is
      # generated (it isn't in git), then given kwek's launcher icon, as in `just android`.
      - name: Build the APK
        env:
          KWEK_UPDATES: "1"
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android init --ci
          pnpm tauri icon src-tauri/icons/android-icon.json -o target/android-icons
          cp -R target/android-icons/android/. src-tauri/gen/android/app/src/main/res/
          pnpm tauri android build --apk --target aarch64

      - name: Sign it
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No Android release key (ANDROID_KEYSTORE) or updater key (TAURI_SIGNING_PRIVATE_KEY). See docs/releasing.md."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/kwek-release.jks"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/zipalign" -f -p 4 \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/kwek-release.jks" --ks-key-alias kwek \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --out kwek-android.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify kwek-android.apk
          pnpm tauri signer sign "$PWD/kwek-android.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: |
            kwek-android.apk
            kwek-android.apk.sig
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: macos-latest
    env:
      # The oldest macOS kwek runs on, as tauri.conf.json's minimumSystemVersion says.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Actions pinned to commits and no build cache: this job holds the signing secrets,
    # so nothing in it may change under it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the version everywhere
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          npm="$(jq -r .version package.json)"
          tauri="$(jq -r .version src-tauri/tauri.conf.json)"
          for v in "$cargo" "$npm" "$tauri"; do
            if [ "$version" != "$v" ]; then
              echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $cargo, package.json $npm, tauri.conf.json $tauri"
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - run: tools/fetch-model.sh
      - run: pnpm install --frozen-lockfile
      - run: cargo test -p kwek-core

      - name: Build for Apple silicon
        env:
          # Check for Updates and the update check at start (src-tauri/src/update.rs).
          KWEK_UPDATES: "1"
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Sign and notarize
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          app=target/aarch64-apple-darwin/release/bundle/macos/kwek.app
          echo "APP=$app" >> "$GITHUB_ENV"
          if [ -z "$CERTIFICATE" ]; then
            echo "::warning::No signing secrets: the release is ad-hoc signed only, so after each update macOS asks for the password to kwek's saved sign-in. See docs/releasing.md."
            codesign --force --sign - "$app"
            codesign --verify --strict --verbose=2 "$app"
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          # Ours first, then the ones already there (one word each, so unquoted).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          if [ -z "$APPLE_ID" ]; then
            # The self-signed "kwek release" certificate (tools/make-release-cert.sh): not
            # notarized, but the same signer every release, so the Keychain keeps trusting
            # kwek across updates.
            codesign --force --sign "$SIGNING_IDENTITY" "$app"
            codesign --verify --strict --verbose=2 "$app"
            echo "SIGNED=self" >> "$GITHUB_ENV"
            exit 0
          fi

          # Apple's Developer ID intermediate, so the chain is whole on a fresh runner.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"

          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --strict --verbose=2 "$app"

          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$app"
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      # The Windows job's installer and its updater signature, into the working directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android

      # What installed copies update from: the signed app as kwek.app.tar.gz, its signature
      # by the updater key (docs/releasing.md), and latest.json pointing at both. kwek reads
      # latest.json from releases/latest, so the newest release is always the one offered.
      - name: Update bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Without it this release would become "latest" with no latest.json, and every
          # installed copy's update check would fail until the next one.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::No updater key (TAURI_SIGNING_PRIVATE_KEY). See docs/releasing.md."
            exit 1
          fi
          COPYFILE_DISABLE=1 tar -czf kwek.app.tar.gz -C "$(dirname "$APP")" kwek.app
          pnpm tauri signer sign "$PWD/kwek.app.tar.gz"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n --arg version "$VERSION" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat kwek.app.tar.gz.sig)" \
            --arg url "$download/kwek.app.tar.gz" \
            --arg win_signature "$(cat kwek-windows-setup.exe.sig)" \
            --arg win_url "$download/kwek-windows-setup.exe" \
            --arg apk_signature "$(cat kwek-android.apk.sig)" \
            --arg apk_url "$download/kwek-android.apk" \
            '{version: $version, pub_date: $date, platforms: {
              "darwin-aarch64": {signature: $signature, url: $url},
              "windows-x86_64": {signature: $win_signature, url: $win_url},
              "android-aarch64": {signature: $apk_signature, url: $apk_url}}}' \
            > latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The same name every release, so releases/latest/download/kwek-macOS.zip (the
          # README's download button) always gets the newest.
          zip="kwek-macOS.zip"
          ditto -c -k --keepParent "$APP" "$zip"
          setup="kwek works with your own Google Cloud project: before the first launch, follow the setup guide (https://github.com/$GITHUB_REPOSITORY/blob/main/docs/setup.md) and keep the client file it ends with. kwek asks for it on first start."
          if [ "$SIGNED" = yes ]; then
            open_it="For Macs with Apple silicon, macOS 13 or later. Download $zip, unzip it and drag kwek into Applications."
          else
            open_it="For Macs with Apple silicon, macOS 13 or later. Download $zip, unzip it and drag kwek into Applications. This build isn't notarized by Apple, so macOS blocks it the first time: open it once, then go to System Settings, Privacy & Security, and click Open Anyway. Or run \`xattr -dr com.apple.quarantine /Applications/kwek.app\` in Terminal."
          fi
          windows="For Windows 10 and 11 (64-bit): download kwek-windows-setup.exe and run it. It isn't code-signed, so SmartScreen warns the first time: click More info, then Run anyway."
          android="For Android phones (arm64): download kwek-android.apk on the phone and open it. Android asks once to allow installing apps from your browser or file manager."
          updates="kwek updates itself (on a Mac from 0.3.0 on): it offers a new version when there is one. On a Mac, Check for Updates in the kwek menu asks right away. On Android it offers the new APK to download and install over the old one."
          printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' "$open_it" "$windows" "$android" "$setup" "$updates" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$zip" kwek.app.tar.gz kwek-windows-setup.exe kwek-android.apk latest.json --title "kwek $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
